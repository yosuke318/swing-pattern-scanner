# v1 に「相対強度が弱ければ見送り」（relative_strength_20d >= 0 を必須）を足した版。
# 閾値・出口は暫定値。バックテスト（[4-3] [4-4]）で決める。
pattern_id: golden_cross_uptrend
version: 2
name: ゴールデンクロス＋上昇構造
category: trend
active: true
regimes:
  vol: [normal]
  trend: [uptrend]
conditions:
  - {key: golden_cross_within_days, op: "<=", value: 5, weight: 20}
  - {key: swing_low_higher_than_prior, op: "==", value: true, weight: 20}
  - {key: adx14, op: ">=", value: 20, weight: 20}
  - {key: close_minus_ma25_atr_ratio, op: between, value: [-1.0, 0.5], weight: 20}
  - {key: relative_strength_20d, op: ">=", value: 0, weight: 20, required: true}
score_threshold: 80
exit:
  stop: {type: swing_low_or_atr, atr_mult: 1.5}
  target: {atr_mult: 3.0}
  max_holding_days: 10
