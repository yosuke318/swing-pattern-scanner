# 日次処理とバックテストで共通の設定。
# 認証情報や通知先のアドレス・トークンは GitHub Actions Secrets に置き、ここには書かない。

fetch:
  # 取得する営業日数。最長の計算期間（ATR252パーセンタイル = 252 + 14日、200日MA）に余裕を持たせる
  lookback_days: 300

# 指標計算のパラメータ。バックテストで比べて決め、日次処理も同じ値を使う
features:
  golden_cross_pair: [25, 75]
  # スイング高値・安値の検出で見る前後の日数 N。i 日目のスイングは i+N 日目に確定する
  swing_window: 3
  # HH/HL 判定で比べる直近のスイングの個数
  structure_pairs: 2
  # trend_regime の決め方。adx / structure / ma / vote（3つのうち2つ以上が同じ向き）
  trend_method: vote
  # レジームが連続でこの日数続くまで切り替えない。1 なら毎日そのまま切り替える
  hysteresis_days: 1

markets:
  JP:
    # 20日平均売買代金の下限（円）。これ未満は流動性フィルタで除外する
    min_trading_value_20d: 100000000
    # 市場環境フィルタと相対強度に使う指数ETF（ベンチマーク）。監視銘柄とは別枠で、通知対象にはしない
    benchmark_symbol: "1306"
  US:
    # 20日平均売買代金の下限（ドル）
    min_trading_value_20d: 10000000
    benchmark_symbol: SPY

scoring:
  # パターン定義に score_threshold が無いときの既定値
  default_score_threshold: 75

notification:
  # 同一銘柄・同一パターンを再通知しない営業日数
  cooldown_business_days: 5
  email:
    enabled: true
  line:
    enabled: false

# 除外フィルタ。除外しても判定ログには残す
filters:
  # trading_value_20d が markets.<市場>.min_trading_value_20d 未満なら除外
  liquidity: true
  # 判定日から max_holding_days 営業日以内に決算日（events.yaml）があれば除外
  earnings: true
  # 直近この日数以内（未来を含む）に決算日の登録が無い監視銘柄を、登録漏れとして通知で警告する
  earnings_registration_lookback_days: 90

market_filter:
  # 指数が downtrend のときの扱い。off: 何もしない / annotate: 通知に注記 / suppress: 通知を抑制
  mode: annotate
